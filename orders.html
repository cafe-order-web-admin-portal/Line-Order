<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b45">
<title>Café Amazon | Order Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#176b45;--green2:#e9f4ed;--ink:#252820;--muted:#788078;--bg:#f4f6f3;--line:#e3e9e3;--red:#a33d32;--orange:#9a5a14}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',sans-serif}.bar{background:#fff;border-bottom:1px solid var(--line);padding:15px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:2}.brand{font:600 18px Prompt;color:var(--green)}.sub{color:var(--muted);font-size:12px}.wrap{max-width:1100px;margin:auto;padding:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}.login{max-width:430px;margin:7vh auto}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:7px 0 14px}.btn{border:0;border-radius:10px;background:var(--green);color:#fff;padding:10px 16px;font:600 13px 'IBM Plex Sans Thai';cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.gray{background:#eef2ee;color:#394239}.btn.red{background:#fff0ee;color:var(--red)}.error{color:var(--red);font-size:13px;margin-top:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar select,.toolbar input{padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit;background:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.stat b{font:600 22px Prompt;color:var(--green)}.stat small{display:block;color:var(--muted)}.order{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;margin:12px 0}.orderhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}.orderid{font:600 16px Prompt}.pill{border-radius:20px;background:var(--green2);color:var(--green);padding:4px 10px;font-size:11px}.meta{font-size:12px;color:var(--muted);margin-top:5px}.items{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin:12px 0;font-size:13px}.items small{color:var(--muted);display:block}.total{font-weight:700;text-align:right;margin:10px 0}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.actions select{padding:9px;border:1px solid var(--line);border-radius:9px;font:inherit}.muted{color:var(--muted)}.hidden{display:none!important}.foot{font-size:11px;color:var(--muted);text-align:center;padding:20px}@media(max-width:650px){.grid{grid-template-columns:1fr}.bar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="bar"><div><div class="brand">Café Amazon · Order Management</div><div class="sub">ตลาดทวีสมาน · หน้าจัดการคำสั่งซื้อ</div></div><div class="toolbar"><a href="./index.html" class="btn gray" style="text-decoration:none">กลับ Web Admin</a><button id="refresh" class="btn gray hidden">รีเฟรช</button><button id="logout" class="btn red hidden">ออกจากระบบ</button></div></header>
<main class="wrap">
<section id="login-panel" class="panel login"><h2 style="font:600 20px Prompt;margin-top:0">เข้าสู่ระบบพนักงาน</h2><div class="muted">ใช้บัญชี Supabase Auth เดียวกับ Web Admin Portal</div><label>อีเมล</label><input class="field" id="email" type="email" autocomplete="username"><label>รหัสผ่าน</label><input class="field" id="password" type="password" autocomplete="current-password"><button class="btn" id="login" style="width:100%">เข้าสู่ระบบ</button><div class="error" id="login-error"></div></section>
<section id="app" class="hidden">
  <div class="panel"><div class="toolbar" style="justify-content:space-between"><div><h2 style="font:600 20px Prompt;margin:0">รายการคำสั่งซื้อ</h2><div class="sub" id="signed-in"></div></div><div class="toolbar"><select id="status-filter"><option value="all">ทุกสถานะ</option><option value="pending">รอยืนยัน</option><option value="confirmed">ยืนยันแล้ว</option><option value="preparing">กำลังเตรียม</option><option value="ready">พร้อมรับ</option><option value="on_the_way">กำลังจัดส่ง</option><option value="arrived">ถึงจุดหมาย</option><option value="completed">สำเร็จ</option><option value="cancelled">ยกเลิก</option></select><input id="search" placeholder="ค้นหาเลขออเดอร์ / ลูกค้า"></div></div></div>
  <div class="grid"><div class="stat"><b id="count-today">0</b><small>ออเดอร์วันนี้</small></div><div class="stat"><b id="count-pending">0</b><small>รอยืนยัน / กำลังดำเนินการ</small></div></div>
  <div id="orders-list"></div>
</section>
</main><div class="foot">สิทธิ์การเห็นข้อมูลและเปลี่ยนสถานะถูกตรวจสอบด้วย Supabase RLS และ Database Function</div>
<script>
'use strict';
const SUPABASE_URL='https://ytxbnqosenolojifeikf.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_etVnNCvAjs9Q-F5k_E7UIw_NwULqK2x';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
const labels={pending:'รอยืนยัน',confirmed:'ยืนยันแล้ว',preparing:'กำลังเตรียม',ready:'พร้อมรับ',on_the_way:'กำลังจัดส่ง',arrived:'ถึงจุดหมาย',completed:'สำเร็จ',cancelled:'ยกเลิก'};
const transitions={pending:['confirmed','cancelled'],confirmed:['preparing','cancelled'],preparing:['ready','cancelled'],ready:['completed','on_the_way','cancelled'],on_the_way:['arrived','cancelled'],arrived:['completed'],completed:[],cancelled:[]};
let orderCache=[];
const money=n=>'฿'+Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function todayLocal(d){const x=new Date(d);return x.toLocaleDateString('en-CA');}
async function showSession(session){
  $('login-panel').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);$('logout').classList.toggle('hidden',!session);$('refresh').classList.toggle('hidden',!session);
  if(session){$('signed-in').textContent=session.user.email||'Staff account';await loadOrders();}
}
async function loadOrders(){
  $('orders-list').innerHTML='<div class="panel muted">กำลังโหลดคำสั่งซื้อ…</div>';
  const {data:orders,error}=await db.from('orders').select('id,order_number,branch_id,customer_id,order_status,payment_status,total_amount,customer_note,created_at,updated_at').order('created_at',{ascending:false}).limit(100);
  if(error){$('orders-list').innerHTML='<div class="panel error">โหลดรายการไม่สำเร็จ: '+esc(error.message)+'</div>';return;}
  const ids=(orders||[]).map(o=>o.id), customerIds=[...new Set((orders||[]).map(o=>o.customer_id))];
  let customers=[],items=[];
  if(customerIds.length){const r=await db.from('customers').select('id,customer_name,phone,line_user_id').in('id',customerIds);if(r.error){$('orders-list').innerHTML='<div class="panel error">อ่านข้อมูลลูกค้าไม่สำเร็จ: '+esc(r.error.message)+'</div>';return;}customers=r.data||[];}
  if(ids.length){const r=await db.from('order_items').select('order_id,product_name,quantity,unit_price,subtotal,selected_options').in('order_id',ids);if(r.error){$('orders-list').innerHTML='<div class="panel error">อ่านรายการสินค้าไม่สำเร็จ: '+esc(r.error.message)+'</div>';return;}items=r.data||[];}
  const cm=new Map(customers.map(c=>[c.id,c]));
  orderCache=(orders||[]).map(o=>({...o,customer:cm.get(o.customer_id)||{},items:items.filter(i=>i.order_id===o.id)}));
  const today=todayLocal(new Date());$('count-today').textContent=orderCache.filter(o=>todayLocal(o.created_at)===today).length;
  $('count-pending').textContent=orderCache.filter(o=>['pending','confirmed','preparing','ready','on_the_way','arrived'].includes(o.order_status)).length;
  renderOrders();
}
function renderOrders(){
  const filter=$('status-filter').value,search=$('search').value.trim().toLowerCase();
  const list=orderCache.filter(o=>(filter==='all'||o.order_status===filter)&&(!search||[o.order_number,o.customer.customer_name,o.customer.phone].some(v=>String(v||'').toLowerCase().includes(search))));
  if(!list.length){$('orders-list').innerHTML='<div class="panel muted">ไม่พบคำสั่งซื้อในเงื่อนไขนี้</div>';return;}
  $('orders-list').innerHTML=list.map(o=>{
    const next=transitions[o.order_status]||[];
    const items=o.items.map(i=>{let opts=[];try{opts=Array.isArray(i.selected_options)?i.selected_options.map(x=>x.option_name):[]}catch{}return '<div><b>'+esc(i.product_name)+'</b> × '+i.quantity+' <span class="muted">'+money(i.subtotal)+'</span><small>'+esc(opts.join(', '))+'</small></div>';}).join('');
    const select=next.length?'<select data-status-select="'+esc(o.id)+'"><option value="">เปลี่ยนสถานะ…</option>'+next.map(s=>'<option value="'+s+'">'+labels[s]+'</option>').join('')+'</select><button class="btn" data-update="'+esc(o.id)+'">บันทึก</button>':'<span class="muted">ไม่มีขั้นตอนถัดไป</span>';
    return '<article class="order"><div class="orderhead"><div><div class="orderid">'+esc(o.order_number)+'</div><div class="meta">'+new Date(o.created_at).toLocaleString('th-TH')+' · '+esc(o.customer.customer_name||'ลูกค้า LINE')+(o.customer.phone?' · '+esc(o.customer.phone):'')+'</div></div><span class="pill">'+(labels[o.order_status]||esc(o.order_status))+'</span></div><div class="items">'+(items||'<span class="muted">ไม่มีรายการสินค้า</span>')+'</div>'+(o.customer_note?'<div class="meta">หมายเหตุ: '+esc(o.customer_note)+'</div>':'')+'<div class="total">ยอดรวม '+money(o.total_amount)+' · ชำระเงิน: '+esc(o.payment_status||'-')+'</div><div class="actions"><span class="meta">สาขา PKT001</span><div class="toolbar">'+select+'</div></div></article>';
  }).join('');
}
async function login(){
  $('login-error').textContent='';const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
  if(error){$('login-error').textContent=error.message;return;}await showSession(data.session);
}
async function updateStatus(orderId){
  const select=document.querySelector('[data-status-select="'+CSS.escape(orderId)+'"]');const status=select?.value;if(!status){alert('กรุณาเลือกสถานะใหม่');return;}
  const button=document.querySelector('[data-update="'+CSS.escape(orderId)+'"]');button.disabled=true;button.textContent='กำลังบันทึก…';
  const {data,error}=await db.functions.invoke('update-order-status',{body:{order_id:orderId,new_status:status}});
  if(error||!data?.success){alert(data?.error||error?.message||'ไม่สามารถเปลี่ยนสถานะได้');button.disabled=false;button.textContent='บันทึก';return;}
  await loadOrders();
}
$('login').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login();});$('refresh').onclick=loadOrders;$('logout').onclick=async()=>{await db.auth.signOut();await showSession(null);};$('status-filter').onchange=renderOrders;$('search').oninput=renderOrders;
$('orders-list').addEventListener('click',e=>{const b=e.target.closest('[data-update]');if(b)updateStatus(b.dataset.update);});
db.auth.onAuthStateChange((_event,session)=>{showSession(session);});
db.auth.getSession().then(({data})=>showSession(data.session));
setInterval(()=>{if(!$('app').classList.contains('hidden'))loadOrders();},20000);
</script>
</body></html>
