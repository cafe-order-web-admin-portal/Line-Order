<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b3a27">
<title>Café Amazon | สั่งเครื่องดื่ม</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./assets/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--coffee:#593b2b;--green:#176b45;--cream:#f7f4ed;--ink:#29251f;--muted:#827b70;--line:#e9e3d9;--warning:#a85b16;--danger:#a3342b}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'IBM Plex Sans Thai',sans-serif;padding-bottom:96px}
header{background:linear-gradient(120deg,#4b3024,#75513a);color:white;padding:22px 18px 24px;border-radius:0 0 22px 22px}
.top{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:50%;background:#fff;color:var(--green);display:grid;place-items:center;font:700 24px Prompt}
.brand{font:600 18px Prompt}.sub{font-size:12px;opacity:.82}.branch{margin-top:18px;font-size:13px;opacity:.95}.hero{font:600 22px Prompt;margin:8px 0 0}
main{max-width:760px;margin:auto;padding:16px}.status{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.5}
.section-title{font:600 17px Prompt;margin:16px 0 10px}
.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 8px}
.chip{white-space:nowrap;border:1px solid var(--line);border-radius:22px;background:white;padding:8px 14px;font:500 13px 'IBM Plex Sans Thai',sans-serif;color:var(--ink)}
.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden}
.photo{height:118px;background:#eee8dd;display:grid;place-items:center;color:#9b8e7d;font-size:34px}
.photo img{width:100%;height:100%;object-fit:cover}
.info{padding:11px}.name{font-weight:600;font-size:14px;min-height:42px}.desc{font-size:11px;color:var(--muted);min-height:18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px}
.price{font-weight:700;color:var(--green)}
button{font-family:inherit;cursor:pointer}
.add{border:0;background:var(--green);color:white;border-radius:20px;padding:7px 13px;font-weight:600}
.add:disabled{background:#c8c2b9;cursor:not-allowed}
.badge{font-size:10px;color:var(--warning);background:#fff2df;padding:4px 7px;border-radius:12px;display:inline-block;margin-top:6px}
.empty{grid-column:1/-1;text-align:center;padding:30px 12px;color:var(--muted);background:white;border-radius:14px;line-height:1.6}
.cartbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 -4px 20px #0000000b;z-index:3}
.cartmeta{font-size:12px;color:var(--muted)}.carttotal{font-weight:700;font-size:17px}
.checkout{background:var(--green);color:white;border:0;border-radius:12px;padding:12px 22px;font-weight:600}
.checkout:disabled{opacity:.45;cursor:not-allowed}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:5;align-items:flex-end}
.modal.show{display:flex}.sheet{background:white;border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:88vh;overflow:auto}
.sheet h2{font:600 18px Prompt;margin:0 0 14px}.close{float:right;border:0;background:#f2eee8;border-radius:50%;width:32px;height:32px;font-size:20px}
.cartline{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:10px 0;font-size:13px}
.cartline small{display:block;color:var(--muted)}.cart-actions{display:flex;gap:6px;align-items:center}
.qtybtn{border:1px solid var(--line);background:#fff;border-radius:8px;width:28px;height:28px}
.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:6px 0 12px}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.option-group{border-top:1px solid var(--line);padding:12px 0}
.option-group h3{font-size:14px;margin:0 0 8px}.option-choice{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;font-size:13px}
.option-choice label{display:flex;align-items:center;gap:9px;flex:1}
.action-row{display:flex;gap:10px;margin-top:14px}.action-row button{flex:1}
.primary{background:var(--green);color:#fff;border:0;border-radius:11px;padding:12px;font-weight:600}
.secondary{background:white;color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:12px}
.error{color:var(--danger);font-size:12px;margin-top:8px}
.total-row{display:flex;justify-content:space-between;margin:14px 0;font-weight:700}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.photo{height:145px}.modal{align-items:center;justify-content:center}.sheet{max-width:520px;border-radius:20px}}
</style>
</head>
<body>
<header>
  <div class="top"><div class="logo">A</div><div><div class="brand">Café Amazon</div><div class="sub">Order Online · สั่งง่าย รับสะดวก</div></div></div>
  <div class="branch">สาขา ตลาดทวีสมาน · ภูเก็ต</div>
  <div class="hero">เติมความสดชื่นในแบบคุณ ☕</div>
</header>
<main>
  <p class="status" id="status">กำลังเชื่อมต่อระบบ…</p>
  <div class="section-title">เลือกหมวดหมู่</div>
  <div class="chips" id="categories"><button class="chip active" data-cat="all">ทั้งหมด</button></div>
  <div class="section-title">เมนูแนะนำ</div>
  <div class="grid" id="products"><div class="empty">กำลังโหลดเมนู…</div></div>
</main>
<div class="cartbar">
  <div><div class="cartmeta" id="cart-count">0 รายการ</div><div class="carttotal" id="cart-total">฿0.00</div></div>
  <button class="checkout" id="checkout" disabled>ดูตะกร้า</button>
</div>

<div class="modal" id="options-modal">
  <div class="sheet">
    <button class="close" data-close="options-modal">×</button>
    <h2 id="option-product-title">ปรับแต่งเครื่องดื่ม</h2>
    <p class="hint" id="option-product-price"></p>
    <div id="option-groups"></div>
    <div class="error" id="option-error"></div>
    <div class="action-row"><button class="secondary" data-close="options-modal">ยกเลิก</button><button class="primary" id="add-configured">เพิ่มลงตะกร้า</button></div>
  </div>
</div>

<div class="modal" id="cart-modal">
  <div class="sheet">
    <button class="close" data-close="cart-modal">×</button>
    <h2>ตะกร้าของคุณ</h2>
    <div id="cart-lines"></div>
    <div class="total-row"><span>ยอดรวม</span><span id="modal-total">฿0.00</span></div>
    <label class="hint" for="customer-name">ชื่อผู้สั่ง</label>
    <input class="field" id="customer-name" maxlength="120" placeholder="ระบุชื่อสำหรับรับสินค้า">
    <label class="hint" for="customer-phone">เบอร์โทรศัพท์ (ไม่บังคับ)</label>
    <input class="field" id="customer-phone" inputmode="tel" maxlength="30" placeholder="เบอร์โทรศัพท์">
    <label class="hint" for="customer-note">หมายเหตุถึงร้าน (ไม่บังคับ)</label>
    <input class="field" id="customer-note" maxlength="500" placeholder="เช่น ไม่รับหลอด">
    <p class="hint">ระบบจะตรวจสอบราคาและสถานะสินค้าอีกครั้งก่อนบันทึกคำสั่งซื้อ</p>
    <div class="error" id="order-error"></div>
    <button class="primary" style="width:100%" id="confirm-order">ยืนยันคำสั่งซื้อ</button>
  </div>
</div>

<script>
'use strict';
const LIFF_ID='2012679988-ORHhLD7I';
const BRANCH_CODE='PKT001';
const ORDER_FUNCTION_URL='https://ytxbqosenolojifeikf.supabase.co/functions/v1/create-order';
const cfg=window.CAFE_AMAZON_SUPABASE_CONFIG||{};
const db=(cfg.url&&cfg.publishableKey&&window.supabase)?window.supabase.createClient(cfg.url,cfg.publishableKey):null;
let profile=null, allProducts=[], activeCategory='all', cart=new Map();
let optionGroups=[], optionChoices=[], productGroupLinks=[], productOptionLinks=[];
let currentProduct=null, currentSelections=new Map(), activeRequestId=null;
const $=id=>document.getElementById(id);
const money=n=>'฿'+Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStatus(s){$('status').textContent=s}
function showModal(id){$(id).classList.add('show')}
function hideModal(id){$(id).classList.remove('show')}
function getProductGroups(productId){
  const links=productGroupLinks.filter(x=>String(x.product_id)===String(productId));
  return links.map(link=>{
    const group=optionGroups.find(g=>String(g.id)===String(link.group_id));
    if(!group||!group.is_active)return null;
    const choices=productOptionLinks.filter(m=>String(m.product_id)===String(productId)).map(m=>optionChoices.find(o=>String(o.id)===String(m.option_id))).filter(o=>o&&o.is_active&&String(o.group_id)===String(group.id)).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
    return {...link,group,choices};
  }).filter(x=>x&&x.choices.length).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
}
async function start(){
  try{
    await liff.init({liffId:LIFF_ID});
    if(liff.isLoggedIn())profile=await liff.getProfile().catch(()=>null);
  }catch(e){console.error('LIFF init failed:',e);setStatus('เริ่มต้น LIFF ไม่สำเร็จ: '+(e.message||e));}
  if(!db){setStatus('ไม่พบการตั้งค่า Supabase — ตรวจสอบ assets/config.js');$('products').innerHTML='<div class="empty">ยังเชื่อมต่อฐานข้อมูลไม่ได้</div>';return;}
  if(profile&&profile.displayName)$('customer-name').value=profile.displayName;
  await loadMenu();
}
async function loadMenu(){
  setStatus('กำลังค้นหาสาขา '+BRANCH_CODE+'…');
  const branchRes=await db.from('branches').select('id,branch_code,branch_name').eq('branch_code',BRANCH_CODE).single();
  if(branchRes.error||!branchRes.data){setStatus('ค้นหาสาขาไม่สำเร็จ: '+(branchRes.error?.message||'ไม่พบสาขา'));$('products').innerHTML='<div class="empty">ไม่พบข้อมูลสาขา กรุณาตรวจสอบรหัสสาขา</div>';return;}
  const branch=branchRes.data;
  const [catRes,linkRes]=await Promise.all([
    db.from('categories').select('id,category_name,sort_order,is_active').eq('is_active',true).order('sort_order',{ascending:true}),
    db.from('branch_products').select('product_id,price,is_available').eq('branch_id',branch.id)
  ]);
  if(catRes.error){setStatus('อ่านหมวดหมู่ไม่สำเร็จ: '+catRes.error.message);$('products').innerHTML='<div class="empty">โหลดหมวดหมู่ไม่สำเร็จ</div>';return;}
  if(linkRes.error){setStatus('อ่านรายการสินค้าสาขาไม่สำเร็จ: '+linkRes.error.message);$('products').innerHTML='<div class="empty">โหลดรายการสินค้าสาขาไม่สำเร็จ</div>';return;}
  const links=linkRes.data||[], ids=[...new Set(links.map(x=>x.product_id).filter(Boolean))];
  if(!ids.length){renderCategories(catRes.data||[]);allProducts=[];renderProducts();setStatus('พบสาขา '+branch.branch_name+' แต่ยังไม่มีสินค้าใน branch_products');return;}
  const productRes=await db.from('products').select('id,category_id,product_code,product_name,description,image_url,is_active,is_featured,display_order').in('id',ids).order('display_order',{ascending:true});
  if(productRes.error){setStatus('อ่านสินค้าไม่สำเร็จ: '+productRes.error.message);$('products').innerHTML='<div class="empty">โหลดสินค้าไม่สำเร็จ</div>';return;}
  const priceMap=new Map(links.map(x=>[String(x.product_id),x]));
  allProducts=(productRes.data||[]).map(p=>{const bp=priceMap.get(String(p.id))||{};const price=Number(bp.price??0);return {...p,price,is_available:bp.is_available===true,can_order:p.is_active===true&&bp.is_available===true&&price>0};});
  await loadOptions(ids);
  renderCategories(catRes.data||[]);renderProducts();
  const orderable=allProducts.filter(p=>p.can_order).length;
  setStatus('สาขา '+branch.branch_name+' · พบสินค้า '+allProducts.length+' รายการ · พร้อมสั่ง '+orderable+' รายการ');
}
async function loadOptions(productIds){
  const [groupsRes,productGroupsRes,optionsRes,productOptionsRes]=await Promise.all([
    db.from('product_option_groups').select('id,group_code,group_name,selection_type,is_active,sort_order').eq('is_active',true).order('sort_order'),
    db.from('product_option_group_products').select('product_id,group_id,is_required,min_select,max_select,sort_order').in('product_id',productIds),
    db.from('product_options').select('id,group_id,option_code,option_name,price_delta,is_active,sort_order').eq('is_active',true).order('sort_order'),
    db.from('product_option_product_options').select('product_id,option_id,sort_order').in('product_id',productIds)
  ]);
  const error=[groupsRes,productGroupsRes,optionsRes,productOptionsRes].find(x=>x.error);
  if(error){console.warn('Option loading issue:',error.error);optionGroups=[];productGroupLinks=[];optionChoices=[];productOptionLinks=[];return;}
  optionGroups=groupsRes.data||[];productGroupLinks=productGroupsRes.data||[];optionChoices=optionsRes.data||[];productOptionLinks=productOptionsRes.data||[];
}
function renderCategories(cats){
  $('categories').innerHTML='<button class="chip active" data-cat="all">ทั้งหมด</button>'+cats.map(c=>'<button class="chip" data-cat="'+esc(c.id)+'">'+esc(c.category_name)+'</button>').join('');
}
function renderProducts(){
  const list=activeCategory==='all'?allProducts:allProducts.filter(p=>String(p.category_id)===String(activeCategory));
  $('products').innerHTML=list.length?list.map(p=>'<article class="card"><div class="photo">'+(p.image_url?'<img src="'+esc(p.image_url)+'" alt="'+esc(p.product_name)+'">':'☕')+'</div><div class="info"><div class="name">'+esc(p.product_name)+'</div><div class="desc">'+esc(p.description||p.product_code||'')+'</div><div class="row"><span class="price">'+(p.price>0?money(p.price):'รอระบุราคา')+'</span><button class="add" data-add="'+esc(p.id)+'" '+(p.can_order?'':'disabled')+'>'+(p.can_order?'+ เพิ่ม':'ยังไม่เปิดขาย')+'</button></div>'+(p.can_order?'':'<span class="badge">รอเปิดสถานะขายของสาขา</span>')+'</div></article>').join(''):'<div class="empty">ยังไม่มีสินค้าในหมวดนี้</div>';
}
function openProductOptions(product){
  currentProduct=product;currentSelections=new Map();$('option-product-title').textContent=product.product_name;$('option-product-price').textContent='ราคาเริ่มต้น '+money(product.price);$('option-error').textContent='';
  const groups=getProductGroups(product.id);
  if(!groups.length){addConfiguredProduct([]);return;}
  $('option-groups').innerHTML=groups.map(g=>{
    const inputType=g.group.selection_type==='multiple'?'checkbox':'radio';
    const req=g.is_required||g.min_select>0?' *':' (ไม่บังคับ)';
    return '<section class="option-group" data-group="'+esc(g.group_id)+'" data-min="'+g.min_select+'" data-max="'+g.max_select+'" data-type="'+inputType+'"><h3>'+esc(g.group.group_name)+req+'</h3>'+g.choices.map(o=>'<div class="option-choice"><label><input type="'+inputType+'" name="option-'+esc(g.group_id)+'" value="'+esc(o.id)+'" data-option-group="'+esc(g.group_id)+'"> '+esc(o.option_name)+'</label><span>'+((Number(o.price_delta)||0)!==0?((o.price_delta>0?'+':'')+money(o.price_delta)):'')+'</span></div>').join('')+'</section>';
  }).join('');
  showModal('options-modal');
}
function collectOptions(){
  const selected=[];
  for(const section of $('option-groups').querySelectorAll('[data-group]')){
    const groupId=section.dataset.group,min=Number(section.dataset.min||0),max=Number(section.dataset.max||1);
    const count=section.querySelectorAll('input:checked').length;
    if(count<min||count>max){$('option-error').textContent='กรุณาเลือก '+section.querySelector('h3').textContent.replace(' *','').replace(' (ไม่บังคับ','')+' ให้ถูกต้อง';return null;}
    section.querySelectorAll('input:checked').forEach(input=>selected.push(input.value));
  }
  return selected;
}
function addConfiguredProduct(optionIds){
  if(!currentProduct)return;
  const key=String(currentProduct.id)+'|'+[...optionIds].sort().join(',');
  const found=cart.get(key);
  cart.set(key,{key,product:currentProduct,qty:(found?.qty||0)+1,optionIds:[...optionIds]});
  activeRequestId=null;updateCart();hideModal('options-modal');currentProduct=null;
}
function updateCart(){
  let qty=0,total=0;cart.forEach(x=>{qty+=x.qty;total+=x.qty*x.product.price;});
  $('cart-count').textContent=qty+' รายการ';$('cart-total').textContent=money(total);$('checkout').disabled=!qty;
}
function renderCart(){
  $('cart-lines').innerHTML=[...cart.values()].map(x=>{
    const labels=x.optionIds.map(id=>optionChoices.find(o=>String(o.id)===String(id))?.option_name).filter(Boolean).join(', ');
    return '<div class="cartline"><div><b>'+esc(x.product.product_name)+'</b><small>'+(labels?esc(labels):'')+'</small><small>'+money(x.product.price)+' / รายการ</small></div><div class="cart-actions"><button class="qtybtn" data-dec="'+esc(x.key)+'">−</button><b>'+x.qty+'</b><button class="qtybtn" data-inc="'+esc(x.key)+'">+</button></div></div>';
  }).join('');
  $('modal-total').textContent=$('cart-total').textContent;
}
async function submitOrder(){
  $('order-error').textContent='';
  if(!liff.isLoggedIn()){ $('order-error').textContent='กรุณาเปิดลิงก์ผ่าน LINE และเข้าสู่ระบบก่อนสั่งซื้อ';return; }
  const idToken=liff.getIDToken();
  if(!idToken){$('order-error').textContent='ไม่พบ LINE ID Token กรุณาตรวจสอบ LIFF Scope ว่ามี openid';return;}
  const items=[...cart.values()].map(x=>({product_id:x.product.id,quantity:x.qty,option_ids:x.optionIds}));
  if(!items.length){$('order-error').textContent='กรุณาเลือกสินค้าอย่างน้อย 1 รายการ';return;}
  if(!activeRequestId)activeRequestId=crypto.randomUUID();
  const button=$('confirm-order');button.disabled=true;button.textContent='กำลังส่งคำสั่งซื้อ…';
  try{
    const response=await fetch(ORDER_FUNCTION_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':cfg.publishableKey},
      body:JSON.stringify({
        id_token:idToken,
        request_id:activeRequestId,
        customer_name:$('customer-name').value.trim(),
        phone:$('customer-phone').value.trim(),
        customer_note:$('customer-note').value.trim(),
        items
      })
    });
    const result=await response.json().catch(()=>({error:'ไม่สามารถอ่านผลตอบกลับจากระบบได้'}));
    if(!response.ok||result.success!==true)throw new Error(result.error||'ไม่สามารถบันทึกคำสั่งซื้อได้');
    cart.clear();activeRequestId=null;updateCart();hideModal('cart-modal');
    alert('รับคำสั่งซื้อเรียบร้อยแล้ว\\nเลขที่ออเดอร์: '+(result.order_number||'-')+'\\nยอดรวม: '+money(result.total_amount));
  }catch(e){console.error('Order submission failed:',e);$('order-error').textContent=e.message||'เกิดข้อผิดพลาด กรุณาลองอีกครั้ง';}
  finally{button.disabled=false;button.textContent='ยืนยันคำสั่งซื้อ';}
}
$('categories').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;activeCategory=b.dataset.cat;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));renderProducts();});
$('products').addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(!b||b.disabled)return;const p=allProducts.find(x=>String(x.id)===b.dataset.add);if(p&&p.can_order)openProductOptions(p);});
$('add-configured').onclick=()=>{const selected=collectOptions();if(selected!==null)addConfiguredProduct(selected);};
$('checkout').onclick=()=>{renderCart();showModal('cart-modal');};
$('confirm-order').onclick=submitOrder;
document.addEventListener('click',e=>{
  const close=e.target.closest('[data-close]');if(close){hideModal(close.dataset.close);return;}
  const inc=e.target.closest('[data-inc]');if(inc){const x=cart.get(inc.dataset.inc);if(x){x.qty++;activeRequestId=null;updateCart();renderCart();}return;}
  const dec=e.target.closest('[data-dec]');if(dec){const x=cart.get(dec.dataset.dec);if(x){if(x.qty<=1)cart.delete(dec.dataset.dec);else x.qty--;activeRequestId=null;updateCart();renderCart();}return;}
});
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)hideModal(m.id);}));
start();
</script>
</body>
</html>
